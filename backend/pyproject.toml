[project]
name = "agent-studio-backend"
version = "0.1.0"
description = "Agent Studio backend: AI workflows on FastAPI and PostgreSQL"
authors = [
    { name = "Edge Flow", email = "20158566+edgflow@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "cryptography>=50",
    "email-validator>=2.3.0",
    "fastapi>=0.162",
    "httpx>=0.28",
    "langgraph>=1.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17.2",
]

[tool.uv.build-backend]
module-name = "studio"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
